@media (min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:box-shadow .15s;min-width:0}

  function safeEmail(e) { e = String(e || "").trim(); return /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(e) ? e : ""; }
  function uid() { try { return crypto.randomUUID(); } catch (e) { return "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); } }
  function todayStart() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseDeadline(s) {
    if (!s || s === "Rolling") return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  function isExpired(l) { var d = parseDeadline(l.deadline); return !!d && d < todayStart(); }
  function daysLeft(l) { var d = parseDeadline(l.deadline); return d ? Math.round((d - todayStart()) / 864e5) : null; }
  function fmtDate(s, short) {
    var d = parseDeadline(s); if (!d) return s || "Rolling";
    return d.toLocaleDateString("en-US", short ? { month: "short", day: "numeric", year: "numeric" } : { month: "long", day: "numeric", year: "numeric" });
  }
  function fmtPosted(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? "" : d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); }
  function plural(y) { return y === "Sophomore" ? "Sophomores" : y + "s"; }
  function yearsText(ys) { ys = CLASS_YEARS.filter(function (y) { return (ys || []).indexOf(y) > -1; }); return ys.map(plural).join(", "); }
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

  function normalize(l) {
    var o = l || {};
    var pick = function (v, list, dflt) { return list.indexOf(v) > -1 ? v : dflt; };
    var dl = String(o.deadline || "").trim();
    if (dl !== "Rolling" && !/^\d{4}-\d{2}-\d{2}$/.test(dl)) { var pd = parseDeadline(dl); dl = pd ? pd.getFullYear() + "-" + String(pd.getMonth() + 1).padStart(2, "0") + "-" + String(pd.getDate()).padStart(2, "0") : "Rolling"; }
    return {
      id: o.id || uid(),
      role_title: String(o.role_title || "").trim(),
      company: String(o.company || "").trim(),
      parent_company: o.parent_company ? String(o.parent_company).trim() : "",
      location: String(o.location || "").trim(),
      work_mode: pick(o.work_mode, MODES, ""),
      category: pick(o.category, CATEGORIES, "UI/UX Design"),
      job_type: pick(o.job_type, JOB_TYPES, "Internship"),
      term: String(o.term || "").trim(),
      pay: String(o.pay || "").trim(),
      class_years: CLASS_YEARS.filter(function (y) { return (o.class_years || []).indexOf(y) > -1; }),
      summary: String(o.summary || "").trim(),
      link_url: safeUrl(o.link_url),
      apply_email: safeEmail(o.apply_email),
      deadline: dl || "Rolling",
      alumni_name: o.alumni_name ? String(o.alumni_name).trim() : "",

      updated_at: o.updated_at || o.created_at || new Date().toISOString()
    };
  }

  function readData() {
    try {
      var d = JSON.parse(document.getElementById("board-data").textContent || "{}");
      return { settings: { suggestEmail: safeEmail(d.settings && d.settings.suggestEmail) }, listings: (Array.isArray(d.listings) ? d.listings : []).map(normalize) };
    } catch (e) { return { settings: { suggestEmail: "" }, listings: [] }; }
  }

  var DATA = readData();
  var CAP = { artifact: null, sample: null, downloads: null };
  var state = { tab: "internships", category: "All", year: "All", view: "card", sort: "newest", q: "", page: 0, admin: false, preview: false, status: "live", modal: null };
  var root = document.getElementById("root");

  // ---------- page (re)generation ----------
  function buildPage(data) {
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n" + HEAD +
      document.querySelector('link[rel="icon"]').outerHTML + "\n" +
      '<style id="styles">' + document.getElementById("styles").textContent + "</style>\n</head>\n<body>\n<div id=\"root\"></div>\n" +
      '<script type="application/json" id="board-data">' + json + "<\/script>\n" +
      '<script id="app">' + document.getElementById("app").textContent + "<\/script>\n</body>\n</html>\n";
  }

  var PUBLISH_MSG = {
    conflict: "Someone else saved the board first, so it's reloading with their version. Your change is kept and will reopen.",
    rate_limited: "Saving too quickly. Wait a moment, then save again.",
    too_large: "The board is too large to save. Remove some old listings and try again."
  };
  function readOnlyMsg() { return "Saving isn't available here. Open the board from claude.ai while signed in to make changes."; }

  function commit(newData, flash, draft) {
    if (!CAP.artifact) { toast("Can't save", readOnlyMsg()); return Promise.resolve(false); }
    ss("kujl-flash", flash);
    if (draft) ss("kujl-draft", JSON.stringify(draft));
    busy(true);
    return CAP.artifact.publish(buildPage(newData)).then(function () { return true; }, function (e) {
      busy(false);
      var code = e && e.code;
      if (code === "conflict") { ss("kujl-flash", null); toast("Board changed", PUBLISH_MSG.conflict); return false; }
      ss("kujl-flash", null); ss("kujl-draft", null);
      if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].indexOf(code) > -1) { toast("Can't save", readOnlyMsg()); }
      else toast("Couldn't save", PUBLISH_MSG[code] || ("Something went wrong while publishing" + (e && e.message ? ": " + e.message : "") + ". Try again."));
      return false;
    });
  }

  // ---------- filtering ----------
  function editing() { return state.admin && !state.preview; }
  function togglePreview() { if (!state.admin) return; state.preview = !state.preview; state.status = "live"; state.page = 0; if (state.modal) closeModal(); renderAll(); }
  function inTab(l) { return state.tab === "internships" ? l.job_type === "Internship" : l.job_type !== "Internship"; }
  function filtered() {
    var q = state.q.trim().toLowerCase();
    var r = DATA.listings.filter(function (l) {
      if (!inTab(l)) return false;
      var exp = isExpired(l);
      if (editing() && state.status === "expired" ? !exp : exp) return false;
      if (state.category !== "All" && l.category !== state.category) return false;
      if (state.tab === "internships") {
        if (state.year !== "All" && l.class_years.indexOf(state.year) < 0) return false;
      }
      if (q) {
        var hay = [l.role_title, l.company, l.parent_company, l.location, l.summary, l.term, l.work_mode, l.pay].join(" ").toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    if (state.sort === "deadline") {
      r.sort(function (a, b) { var da = parseDeadline(a.deadline), db = parseDeadline(b.deadline); if (!da && !db) return 0; if (!da) return 1; if (!db) return -1; return da - db; });
    } else {

    }

  }
  function expiredCount() { return DATA.listings.filter(function (l) { return inTab(l) && isExpired(l); }).length; }

  // ---------- badges ----------

  function cardHTML(l) {
    var intern = l.job_type === "Internship";
    var dl = parseDeadline(l.deadline), left = daysLeft(l), exp = isExpired(l);
    var link = safeUrl(l.link_url), mail = safeEmail(l.apply_email);

  function renderResults() {
    var list = filtered();
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (state.page > pages - 1) state.page = pages - 1;
    var slice = list.slice(state.page * PAGE_SIZE, state.page * PAGE_SIZE + PAGE_SIZE);
    var noun = state.tab === "internships" ? "internship" : "job";
    var count = document.getElementById("count");
    if (count) count.textContent = list.length + " " + noun + (list.length === 1 ? "" : "s") + (editing() && state.status === "expired" ? " expired" : "");
    var el = document.getElementById("results");
    if (!list.length) {
      var anyInTab = DATA.listings.some(function (l) { return inTab(l) && !isExpired(l); });
      var filtering = state.q || state.category !== "All" || (state.tab === "internships" && state.year !== "All");
      var big, small, btn = "";
      if (editing() && state.status === "expired") { big = "No expired " + noun + "s"; small = "Listings move here automatically after their deadline passes."; }
      else if (filtering) { big = "No " + noun + "s match these filters"; small = "Try a different search or clear a filter."; btn = '<button class="btn btn-outline" data-action="clear">Clear filters</button>'; }
      else if (editing() && !anyInTab) { big = "Add your first " + noun; small = "Paste a posting or drop a PDF or screenshot, and the details fill in for you to check."; btn = '<button class="btn btn-primary" data-action="add">' + icon("plus", "i-sm") + "Add " + noun + "</button>"; }
      else { big = "No " + noun + "s posted right now"; small = "New postings are added as they come in. Check back soon."; }
      el.innerHTML = '<div class="empty">' + icon("briefcase", "i-xl") + '<p class="big">' + big + '</p><p class="small">' + small + "</p>" + btn + "</div>";

      el.innerHTML = '<div class="grid">' + slice.map(cardHTML).join("") + "</div>";

    if (pages <= 1) { pg.innerHTML = ""; return; }
    var h = '<button class="btn btn-outline" data-action="page" data-v="' + (state.page - 1) + '"' + (state.page === 0 ? " disabled" : "") + ">Previous</button>";
    for (var p = Math.max(0, state.page - 2); p <= Math.min(pages - 1, state.page + 2); p++) h += '<button class="btn btn-outline" data-action="page" data-v="' + p + '"' + (p === state.page ? ' aria-current="page"' : "") + ">" + (p + 1) + "</button>";
    h += '<button class="btn btn-outline" data-action="page" data-v="' + (state.page + 1) + '"' + (state.page >= pages - 1 ? " disabled" : "") + ">Next</button>";
    pg.innerHTML = h;
  }

  }

  // ---------- modals ----------
  function openModal(m) { state.lastFocus = document.activeElement; state.modal = m; renderModal(); }
  function closeModal() {
    if (state.modal && state.modal.ctl) try { state.modal.ctl.abort(); } catch (e) {}
    state.modal = null; renderModal();
    if (state.lastFocus && document.contains(state.lastFocus)) try { state.lastFocus.focus(); } catch (e) {}
  }
  function find(id) { for (var i = 0; i < DATA.listings.length; i++) if (DATA.listings[i].id === id) return DATA.listings[i]; return null; }

  function renderModal() {
    var el = document.getElementById("modal");
    var m = state.modal;
    if (!m) { el.innerHTML = ""; document.body.style.overflow = ""; return; }
    document.body.style.overflow = "hidden";
    var html = "";
    if (m.type === "detail") html = detailHTML(find(m.id));
    else if (m.type === "editor") html = editorHTML(m);
    else if (m.type === "settings") html = settingsHTML();
    else if (m.type === "confirm") html = confirmHTML(m);
    el.innerHTML = '<div class="overlay" data-action="backdrop">' + html + "</div>";
    var f = el.querySelector("[autofocus]") || el.querySelector(".dialog input, .dialog textarea, .dialog button");
    if (f) try { f.focus({ preventScroll: true }); } catch (e) {}

  function readForm() {
    var m = state.modal; if (!m || m.type !== "editor") return;
    var el = document.getElementById("modal");
    var t = el.querySelector("#ai-text"); if (t) m.aiText = t.value;
    var lk = el.querySelector("#ai-link"); if (lk) m.aiLink = lk.value;
    if (!el.querySelector(".form")) return;
    var d = m.draft;
    el.querySelectorAll("[data-f]").forEach(function (inp) { if (!inp.disabled) d[inp.getAttribute("data-f")] = inp.value; });
    var years = el.querySelectorAll("[data-year]");
    if (years.length) d.class_years = Array.prototype.filter.call(years, function (c) { return c.checked; }).map(function (c) { return c.getAttribute("data-year"); });
    var r = el.querySelector("#f-rolling"); if (r && r.checked) d.deadline = "Rolling";
  }

  function wireEditor() {
    var el = document.getElementById("modal");
    var type = el.querySelector("#f-type");
    if (type) type.addEventListener("change", function () { readForm(); renderModal(); });
    var r = el.querySelector("#f-rolling");
    if (r) r.addEventListener("change", function () { var di = el.querySelector("#f-deadline"); di.disabled = r.checked; if (r.checked) di.value = ""; else di.focus(); });
    var drop = el.querySelector("#drop"), fi = el.querySelector("#ai-file");
    if (drop && fi) {
      fi.addEventListener("change", function () { if (fi.files && fi.files[0]) setFile(fi.files[0]); });
      ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
      ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
      drop.addEventListener("drop", function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) setFile(f); });
      drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fi.click(); } });
    }
  }
  function setFile(f) { readForm(); state.modal.file = f; state.modal.aiError = ""; renderModal(); }

  // ---------- AI extraction ----------
  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function () { rej(new Error("load")); }; document.head.appendChild(s); }); }
  function pdfInput(file) {
    return (window.pdfjsLib ? Promise.resolve() : loadScript(PDFJS)).then(function () {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      return file.arrayBuffer();
    }).then(function (buf) { return window.pdfjsLib.getDocument({ data: buf }).promise; }).then(function (doc) {
      var n = Math.min(doc.numPages, 6), text = "", chain = Promise.resolve();
      for (var i = 1; i <= n; i++) (function (i) { chain = chain.then(function () { return doc.getPage(i); }).then(function (p) { return p.getTextContent(); }).then(function (c) { text += c.items.map(function (it) { return it.str; }).join(" ") + "\n"; }); })(i);
      return chain.then(function () {
        if (text.replace(/\s+/g, "").length > 80) return { text: text };
        return doc.getPage(1).then(function (p) {
          var vp = p.getViewport({ scale: 1.6 }), cv = document.createElement("canvas");
          cv.width = vp.width; cv.height = vp.height;
          return p.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise.then(function () { return new Promise(function (r) { cv.toBlob(r, "image/png"); }); });
        }).then(function (b) { return { image: b }; });
      });
    });
  }
  function prompt(text, hasImage) {
    return "You are reading a job or internship posting for the University of Kansas design program (Interaction Design and Visual Communication Design). Today is " + todayISO() + ".\n\n" +
      "Reply with ONLY one JSON object, no commentary, with exactly these keys:\n" +
      '- "role_title": string\n' +
      '- "company": the actual employer or brand the student would work for. If the posting is on a parent company\'s careers site (for example a Razorfish role on the Publicis Groupe site), use the brand.\n' +
      '- "parent_company": the careers-site owner or parent organization only if different from company, else null\n' +
      '- "location": "City, ST", or "Remote", or "" if unknown\n' +
      '- "work_mode": "On-site" | "Hybrid" | "Remote" | null if not stated\n' +
      '- "category": "UI/UX Design" for UX, UI, product, interaction, web or app design; "Graphic Design" for brand, visual, print, packaging, motion or illustration work\n' +
      '- "job_type": "Internship" | "Full-Time" | "Part-Time" | "Freelance"\n' +
      '- "term": the season and year for internships, like "Summer 2027", or "" if not stated\n' +
      '- "pay": the pay as a short amount, like "$22/hr", "$20–25/hr", "$5,000 stipend" or "$65,000/yr", or "" if no amount is stated\n' +
      '- "class_years": array containing any of "Sophomore", "Junior", "Senior" for whom the internship is realistic. Infer from requirements such as graduation year, "rising juniors", or "must be returning to school after the internship" (which excludes graduating seniors). If it only says current students, include all three. Use [] for non-internships or if you cannot tell.\n' +
      '- "summary": exactly two plain-language sentences for students about what the work is and who it suits\n' +
      '- "link_url": URL to apply or view the posting, or null\n' +
      '- "apply_email": email to apply, or null\n' +
      '- "deadline": application deadline as "YYYY-MM-DD", or "Rolling" if none is stated\n' +
      '- "alumni_name": the person who shared the posting if mentioned, else null\n\n' +
      (safeUrl(state.modal && state.modal.aiLink) ? "The posting's URL is " + safeUrl(state.modal.aiLink) + ". The pasted text may include site menus and footers; ignore them.\n\n" : "The pasted text may include site menus and footers; ignore them.\n\n") +
      (hasImage ? "The posting is in the attached image." + (text ? "\n\nExtra text:\n" + text : "") : "Posting:\n\"\"\"\n" + text.slice(0, 20000) + "\n\"\"\"");
  }
  var SAMPLE_MSG = {
    not_granted: "Claude access wasn't allowed for this page. Fill in the details manually instead.",
    rate_limited: "Too many requests right now. Wait a minute and try again.",
    invalid_json: "The details came back in an unexpected format. Try again, or fill them in manually.",
    too_large: "That posting is too long. Paste just the main description and try again."
  };
  function extract() {
    readForm();
    var m = state.modal, text = (m.aiText || "").trim(), file = m.file;
    if (!text && !file) { m.aiError = "Paste the page text or add a file. The board can't open links on its own."; renderModal(); return; }
    m.aiError = ""; m.aiBusy = file ? "Reading " + file.name + "…" : "Thinking…"; renderModal();
    var ctl = new AbortController(); m.ctl = ctl;
    var prep;
    if (!file) prep = Promise.resolve({ text: text });
    else if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) prep = pdfInput(file).then(function (r) { if (r.text && text) r.text = text + "\n\n" + r.text; return r; }, function () { throw { code: "pdf" }; });
    else if (/^image\//.test(file.type)) prep = Promise.resolve({ image: file, text: text });
    else prep = file.text().then(function (t) { return { text: (text ? text + "\n\n" : "") + t }; });
    prep.then(function (inp) {
      if (state.modal !== m) return;
      m.aiBusy = "Thinking…"; renderModal();
      if (inp.image) {
        return CAP.sample.limits().then(function (lim) {
          if (!lim || !lim.images) throw { code: "no_images" };
          return CAP.sample.json(prompt(inp.text || "", true), { images: [inp.image], signal: ctl.signal });
        });
      }
      return CAP.sample.json(prompt(inp.text, false), { signal: ctl.signal });
    }).then(function (res) {
      if (!res || state.modal !== m) return;
      var d = normalize(Object.assign({}, res, { id: m.draft.id }));
      if (safeUrl(m.aiLink)) d.link_url = safeUrl(m.aiLink);
      m.draft = d; m.aiBusy = ""; m.tab = "form"; m.extracted = true; m.ctl = null;
      renderModal();
    }, function (e) {
      if (state.modal !== m) return;
      m.aiBusy = ""; m.ctl = null;
      var code = e && e.code;
      if (code === "cancelled") { renderModal(); return; }
      m.aiError = code === "pdf" ? "Couldn't read that PDF. Paste the text or drop a screenshot instead."
        : code === "no_images" ? "Images can't be read here. Paste the posting text instead."
        : SAMPLE_MSG[code] || "Couldn't fill in the details. Try again, or fill them in manually.";
      renderModal();
    });
  }

  // ---------- saving ----------
  function saveListing() {
    readForm();
    var m = state.modal, d = m.draft;
    if (!d.role_title.trim() || !d.company.trim()) { m.formError = "Add a role title and company before saving."; renderModal(); return; }
    if (d.link_url && !safeUrl(d.link_url)) { m.formError = "The posting link needs to start with https:// (or http://)."; renderModal(); return; }
    if (d.apply_email && !safeEmail(d.apply_email)) { m.formError = "That apply email doesn't look right."; renderModal(); return; }
    if (d.deadline !== "Rolling" && !/^\d{4}-\d{2}-\d{2}$/.test(d.deadline)) d.deadline = "Rolling";
    var now = new Date().toISOString();
    var rec = normalize(Object.assign({}, d, { updated_at: now, created_at: m.editingId ? d.created_at : now }));
    if (rec.job_type !== "Internship") { rec.class_years = []; }
    var next = { settings: DATA.settings, listings: DATA.listings.filter(function (x) { return x.id !== rec.id; }).concat([rec]) };
    commit(next, (m.editingId ? "Saved changes to " : "Published ") + rec.role_title, { kind: "save", rec: rec, editingId: m.editingId || null });
  }
  function deleteListing(id) {
    var l = find(id);
    var next = { settings: DATA.settings, listings: DATA.listings.filter(function (x) { return x.id !== id; }) };
    commit(next, "Removed " + (l ? l.role_title : "listing"), { kind: "delete", id: id });
  }
  function saveSettings() {
    var v = (document.getElementById("s-email") || {}).value || "";
    v = v.trim();
    if (v && !safeEmail(v)) { toast("Check the email", "That address doesn't look right."); return; }
    commit({ settings: { suggestEmail: v }, listings: DATA.listings }, "Settings saved", null);
  }
  function download() {
    if (!CAP.downloads) return;
    CAP.downloads.save({ filename: "index.html", data: new Blob([buildPage(DATA)], { type: "text/html" }) }).then(function () {
      toast("Site file saved", "Upload index.html to a GitHub repository with Pages turned on to host the board on your own site.");
    }, function (e) { if (e && e.code !== "declined") toast("Couldn't download", "Try again in a moment."); });
  }

  // ---------- toast / busy ----------
  function toast(title, body) {
    var t = document.createElement("div"); t.className = "toast";
    t.innerHTML = "<b>" + esc(title) + "</b>" + (body ? "<span>" + esc(body) + "</span>" : "");
    var box = document.getElementById("toasts"); if (!box) return;
    box.appendChild(t); setTimeout(function () { t.remove(); }, 6000);
  }

    if (on && !b) { b = document.createElement("div"); b.id = "busy"; b.className = "busy"; b.innerHTML = icon("loader-circle", "spin i-md") + "<span>Publishing…</span>"; document.body.appendChild(b); }
    if (!on && b) b.remove();
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-action],[data-stop]");
    if (!t) return;
    if (t.hasAttribute("data-stop")) return;
    var a = t.getAttribute("data-action"), v = t.getAttribute("data-v"), id = t.getAttribute("data-id");
    if (a === "backdrop") { if (e.target === t) closeModal(); return; }
    if (t.tagName === "A" && a !== "home") return;
    e.preventDefault();
    switch (a) {
      case "home": state.tab = "internships"; state.page = 0; renderAll(); window.scrollTo(0, 0); break;
      case "tab": if (state.tab !== v) { state.tab = v; state.page = 0; state.category = "All"; state.year = "All"; renderAll(); } break;
      case "sort": state.sort = v; state.page = 0; renderToolbar(); renderResults(); break;
      case "cat": state.category = v; state.page = 0; renderToolbar(); renderResults(); break;
      case "view": state.view = v; try { localStorage.setItem("kujl-view", v); } catch (x) {} renderToolbar(); renderResults(); break;
      case "year": state.year = v; state.page = 0; renderSubbar(); renderResults(); break;
      case "status": state.status = v; state.page = 0; renderAdminBar(); renderResults(); break;
      case "clear": state.q = ""; state.category = "All"; state.year = "All"; state.page = 0; renderToolbar(); renderSubbar(); renderResults(); break;
      case "page": state.page = +v; renderResults(); document.getElementById("head").scrollIntoView({ block: "start" }); break;
      case "open": openModal({ type: "detail", id: id }); break;
      case "close": closeModal(); break;
      case "add": openModal({ type: "editor", tab: CAP.sample ? "ai" : "form", draft: blankListing() }); break;
      case "edit": var l = find(id); if (l) { state.modal = null; openModal({ type: "editor", tab: "form", editingId: id, draft: JSON.parse(JSON.stringify(l)) }); } break;
      case "delete": state.modal = null; openModal({ type: "confirm", id: id }); break;
      case "confirm-delete": deleteListing(id); break;
      case "etab": readForm(); state.modal.tab = v; renderModal(); break;
      case "clear-file": readForm(); state.modal.file = null; renderModal(); break;
      case "extract": extract(); break;
      case "ai-stop": if (state.modal && state.modal.ctl) state.modal.ctl.abort(); break;
      case "save": saveListing(); break;
      case "settings": openModal({ type: "settings" }); break;
      case "save-settings": saveSettings(); break;
      case "download": download(); break;
      case "preview": togglePreview(); break;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.modal) { closeModal(); return; }
    if (e.shiftKey && (e.key === "A" || e.key === "a") && !e.metaKey && !e.ctrlKey && !e.altKey && state.admin) {
      var tag = (document.activeElement && document.activeElement.tagName || "").toUpperCase();
      if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT" && !state.modal) { e.preventDefault(); togglePreview(); return; }
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('article[data-action="open"]')) { e.preventDefault(); openModal({ type: "detail", id: e.target.getAttribute("data-id") }); }
    if (e.key === "Tab" && state.modal) {
      var f = document.querySelectorAll("#modal .dialog a[href], #modal .dialog button:not([disabled]), #modal .dialog input:not([disabled]):not(.sr-only), #modal .dialog select, #modal .dialog textarea, #modal .dialog [tabindex='0']");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "q") { state.q = e.target.value; state.page = 0; renderResults(); } });

  // ---------- boot ----------
  try { var sv = localStorage.getItem("kujl-view"); if (sv === "list" || sv === "card") state.view = sv; } catch (e) {}
  renderShell();

  var flash = ss("kujl-flash"); if (flash) { ss("kujl-flash", null); setTimeout(function () { toast(flash); }, 50); }

  function restoreDraft() {
    var raw = ss("kujl-draft"); if (!raw) return; ss("kujl-draft", null);
    var d; try { d = JSON.parse(raw); } catch (e) { return; }
    if (d.kind === "save") {
      var cur = find(d.rec.id);
      if (cur && cur.updated_at === d.rec.updated_at) return;
      openModal({ type: "editor", tab: "form", editingId: d.editingId, draft: d.rec, restored: true });
    } else if (d.kind === "delete" && find(d.id)) {
      openModal({ type: "confirm", id: d.id });
    }
  }

  if (window.claude && typeof window.claude.use === "function") {
    var use = function (n) { try { return Promise.resolve(window.claude.use(n)).catch(function () { return null; }); } catch (e) { return Promise.resolve(null); } };
    Promise.all([use("user"), use("artifact"), use("sample"), use("downloads")]).then(function (r) {
      var user = r[0];
      CAP.artifact = r[1]; CAP.sample = r[2]; CAP.downloads = r[3];
      if (!user || !CAP.artifact) return false;
      return Promise.all([user.isOwner().catch(function () { return false; }), user.canEdit().catch(function () { return false; })]).then(function (x) { return x[0] || x[1]; });
    }).then(function (isAdmin) {
      if (!isAdmin) return;
      state.admin = true;
      renderAll();
      restoreDraft();
    });
  }
})();
</script>
</body>
</html>
